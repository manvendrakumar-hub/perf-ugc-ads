name: Deploy AI UGC website

on:
  push:
    branches:
      - main
    paths:
      - "MANNY's UGC SYSTEM/**"
      - ".github/workflows/deploy-ugc-site.yml"
  workflow_dispatch:

concurrency:
  group: ai-ugc-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "MANNY's UGC SYSTEM"
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Pull Vercel project settings
        run: npx vercel@56.3.2 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build production website
        run: npx vercel@56.3.2 build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy production website
        run: npx vercel@56.3.2 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
